services:
  letta:
    image: letta/letta:latest@sha256:9f9789eaccc30372cd8c735f53dfd7b7251119a3f04ee12fc0180c489c783f7d
    container_name: letta
    profiles:
    - letta
    restart: unless-stopped
    volumes:
    - letta_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      SECURE: ${LETTA_SECURE:-true}
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:-}
    extra_hosts:
    - host.docker.internal:host-gateway
volumes:
  letta_data: {}
