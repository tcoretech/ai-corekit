services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
    restart: unless-stopped
    container_name: open-webui
    profiles:
    - open-webui
    env_file:
      - .env
    environment:
    - OLLAMA_BASE_URL=http://ollama:11434
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./data:/app/backend/data

