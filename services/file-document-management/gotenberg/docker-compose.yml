services:
  gotenberg:
    image: gotenberg/gotenberg:8@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    container_name: gotenberg
    profiles:
    - gotenberg
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - DISABLE_GOOGLE_CHROME=false
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
