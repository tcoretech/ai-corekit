services:
  docuseal:
    image: docuseal/docuseal:latest@sha256:28d0ca583860e2c73e5b068756023a93a325799a22da1f788355d566865dd051
    container_name: docuseal
    profiles:
    - docuseal
    restart: unless-stopped
    depends_on:
    - docuseal-db
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
    - FORCE_SSL=false
    volumes:
    - docuseal_data:/data
  docuseal-db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: docuseal-db
    profiles:
    - docuseal
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=docuseal
    - POSTGRES_PASSWORD=${DOCUSEAL_DB_PASSWORD}
    - POSTGRES_DB=docuseal
    volumes:
    - docuseal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U docuseal
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  docuseal_data: {}
  docuseal_postgres_data: {}
