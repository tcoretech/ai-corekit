services:
  mailpit:
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: mailpit
    restart: unless-stopped
    volumes:
    - mailpit_data:/data
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    env_file:
      - .env
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH_FILE: ${MAILPIT_UI_AUTH_FILE:-}
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
    expose:
    - '1025'
    - '8025'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '1025'
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  mailpit_data: {}
