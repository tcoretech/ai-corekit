services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
    container_name: paperless-ngx
    profiles:
    - paperless
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - PAPERLESS_REDIS=redis://paperless-redis:6379
    - PAPERLESS_DBENGINE=postgresql
    - PAPERLESS_DBHOST=paperless-db
    - PAPERLESS_DBNAME=paperless
    - PAPERLESS_DBUSER=paperless
    - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
    - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
    - PAPERLESS_TIME_ZONE=Europe/Berlin
    - PAPERLESS_OCR_LANGUAGE=deu+eng
    - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_EMAIL}
    - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
    - PAPERLESS_ADMIN_MAIL=${PAPERLESS_ADMIN_EMAIL}
    - PAPERLESS_URL=https://${PAPERLESS_HOSTNAME}
    - PAPERLESS_FILENAME_FORMAT={created_year}/{correspondent}/{created_date}_{title}
    - PAPERLESS_CONSUMER_RECURSIVE=true
    - PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS=true
    volumes:
    - paperless_data:/usr/src/paperless/data
    - paperless_media:/usr/src/paperless/media
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/usr/src/paperless/consume/seafile
    depends_on:
    - paperless-db
    - paperless-redis
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
  paperless-redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: paperless-redis
    env_file:
      - .env
    profiles:
    - paperless
    restart: unless-stopped
    volumes:
    - paperless_redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 5
  paperless-db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    container_name: paperless-postgres
    profiles:
    - paperless
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_DB=paperless
    - POSTGRES_USER=paperless
    - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
    volumes:
    - paperless_postgresql:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U paperless
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  paperless_data: {}
  paperless_media: {}
  paperless_redis: {}
  paperless_postgresql: {}
