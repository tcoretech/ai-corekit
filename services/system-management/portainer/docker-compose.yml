services:
  portainer:
    image: portainer/portainer-ce:latest@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
    container_name: portainer
    env_file:
      - .env
    profiles:
    - portainer
    restart: unless-stopped
    volumes:
    - ./data:/data
    - ${DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}:/var/run/docker.sock

