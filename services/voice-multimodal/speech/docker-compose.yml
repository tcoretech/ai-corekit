services:
  openedai-speech:
    image: ghcr.io/matatonic/openedai-speech-min:latest@sha256:e82d719252fb1b861967f4f9abb8513f028ab9c1139451245688dbf34992b060
    container_name: openedai-speech
    profiles:
    - speech
    restart: unless-stopped
    expose:
    - '8000'
    volumes:
    - ./data/voices:/app/voices
    - ./config/local/openedai-config:/app/config
    env_file:
      - .env
    environment:
    - TTS_HOME=voices
    - HF_HOME=voices
  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    container_name: faster-whisper
    profiles:
    - speech
    restart: unless-stopped
    expose:
    - '8000'
    env_file:
      - .env
    environment:
    - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-distil-whisper-large-v3}
    - WHISPER__COMPUTE_TYPE=int8
    - WHISPER__DEVICE=cpu
    - WHISPER__CPU_THREADS=4
    volumes:
    - whisper-models:/root/.cache/huggingface
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  whisper-models: {}
