services:
  python-runner:
    image: python:3.11-slim@sha256:65bd3d9f1d7fa268dd1909973ba7eb4bdf41f6dcf2cfbe76ba9528b170f3fd79
    container_name: python-runner
    env_file:
      - .env
    profiles:
    - python-runner
    restart: unless-stopped
    working_dir: /app
    command: /bin/sh -c 'if [ -f /app/requirements.txt ]; then python -m pip install
      --no-cache-dir -r /app/requirements.txt; fi; python /app/main.py'
    volumes:
    - .:/app

