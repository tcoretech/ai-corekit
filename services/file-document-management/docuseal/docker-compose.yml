services:
  docuseal:
    image: docuseal/docuseal:latest@sha256:8ba47ff41ac49e22b6044f6c609411f7ab7ccbb688ff64da7183cb1e71765304
    container_name: docuseal
    profiles:
    - docuseal
    restart: unless-stopped
    depends_on:
    - docuseal-db
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
    - FORCE_SSL=false
    volumes:
    - docuseal_data:/data
  docuseal-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: docuseal-db
    profiles:
    - docuseal
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=docuseal
    - POSTGRES_PASSWORD=${DOCUSEAL_DB_PASSWORD}
    - POSTGRES_DB=docuseal
    volumes:
    - docuseal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U docuseal
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  docuseal_data: {}
  docuseal_postgres_data: {}
