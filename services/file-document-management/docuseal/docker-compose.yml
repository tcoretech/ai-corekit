services:
  docuseal:
    image: docuseal/docuseal:latest@sha256:d67335c0cb3142818a39878ab67a0d0af2a653220e2203b042796dd1321a4a9c
    container_name: docuseal
    profiles:
    - docuseal
    restart: unless-stopped
    depends_on:
    - docuseal-db
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
    - FORCE_SSL=false
    volumes:
    - docuseal_data:/data
  docuseal-db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    container_name: docuseal-db
    profiles:
    - docuseal
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=docuseal
    - POSTGRES_PASSWORD=${DOCUSEAL_DB_PASSWORD}
    - POSTGRES_DB=docuseal
    volumes:
    - docuseal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U docuseal
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  docuseal_data: {}
  docuseal_postgres_data: {}
