services:
  flair-pii:
    build:
      context: ./docker/flair-pii
      dockerfile: Dockerfile
    container_name: flair-pii
    env_file:
      - .env
    profiles:
    - ai-security
    restart: unless-stopped
    volumes:
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import requests; requests.get('http://localhost:8000/health').raise_for_status()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  llm-guard:
    image: laiyer/llm-guard-api:latest@sha256:bea3efb1220ad18149b73de625c55e6d835bf8b45023a089a3762012a86550ba
    container_name: llm-guard
    profiles:
    - ai-security
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - AUTH_TOKEN=${LLM_GUARD_TOKEN}
    - LOG_LEVEL=${LLM_GUARD_LOG_LEVEL:-INFO}
    - APP_WORKERS=2
    - CACHE_MAX_SIZE=100
    - CACHE_TTL=3600
    - SCAN_FAIL_FAST=false
    volumes:
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    container_name: presidio-analyzer
    profiles:
    - ai-security
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - PORT=3000
    - ANALYZER_MIN_SCORE=${PRESIDIO_MIN_SCORE:-0.5}
    volumes:
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    container_name: presidio-anonymizer
    profiles:
    - ai-security
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - PORT=3000
    volumes:
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

