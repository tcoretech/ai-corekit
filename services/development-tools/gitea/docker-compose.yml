services:
  gitea:
    image: gitea/gitea:latest@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    container_name: gitea
    profiles:
    - gitea
    restart: unless-stopped
    depends_on:
    - gitea-db
    env_file:
      - .env
    environment:
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=postgres
    - GITEA__database__HOST=gitea-db:5432
    - GITEA__database__NAME=gitea
    - GITEA__database__USER=gitea
    - GITEA__database__PASSWD=gitea
    ports:
    - ${GITEA_SSH_PORT:-2222}:22
    volumes:
    - gitea_data:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
  gitea-db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    container_name: gitea-db
    profiles:
    - gitea
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=gitea
    - POSTGRES_PASSWORD=gitea
    - POSTGRES_DB=gitea
    volumes:
    - gitea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U gitea
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  gitea_data: {}
  gitea_postgres_data: {}
