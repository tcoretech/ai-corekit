services:
  private-dns:
    image: coredns/coredns:latest@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    container_name: private-dns
    profiles:
      - private-dns
    restart: unless-stopped
    env_file:
      - ./.env
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./config/local/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "${PRIVATE_DNS_TARGET_IP}:53:53/udp"
      - "${PRIVATE_DNS_TARGET_IP}:53:53/tcp"
    healthcheck:
      disable: true