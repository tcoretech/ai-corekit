services:
  docuseal:
    image: docuseal/docuseal:latest@sha256:e171808ce8dabb08491a49a6d8c477670a65ddce5e3de4764904b63a4487940f
    container_name: docuseal
    profiles:
    - docuseal
    restart: unless-stopped
    depends_on:
    - docuseal-db
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
    - FORCE_SSL=false
    volumes:
    - docuseal_data:/data
  docuseal-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: docuseal-db
    profiles:
    - docuseal
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=docuseal
    - POSTGRES_PASSWORD=${DOCUSEAL_DB_PASSWORD}
    - POSTGRES_DB=docuseal
    volumes:
    - docuseal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U docuseal
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  docuseal_data: {}
  docuseal_postgres_data: {}
