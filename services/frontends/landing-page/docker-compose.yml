services:
  landing-page:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: landing-page
    env_file:
      - .env
    profiles:
      - landing-page
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    networks:
      default:
        aliases:
          - landing-page

