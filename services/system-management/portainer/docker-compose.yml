services:
  portainer:
    image: portainer/portainer-ce:latest@sha256:18616fff2998f8ca0e8ebe7f028658ae1682859cf43f212f81a849c1093ad639
    container_name: portainer
    env_file:
      - .env
    profiles:
    - portainer
    restart: unless-stopped
    volumes:
    - ./data:/data
    - ${DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}:/var/run/docker.sock

