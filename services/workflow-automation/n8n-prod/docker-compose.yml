# Production n8n.
#
# A second n8n intended to hold production workflows and the credentials they
# use, separate from an instance where workflows are authored freely. It is
# deliberately narrower than an authoring instance: regular
# execution mode, no community packages, dangerous nodes excluded, no public
# API, no published ports, and its own Postgres that no other stack can reach.
#
# Do not add this stack to a shared network. The only way in is the
# n8n-prod-tunnel connector in this same stack.
services:
  n8n-prod-postgres:
    image: postgres:17
    container_name: n8n-prod-postgres
    profiles:
    - n8n-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_PROD_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_PROD_DB_USER:-n8nprod}
      POSTGRES_PASSWORD: ${N8N_PROD_DB_PASSWORD}
      # Keep the buffer pool small: this server holds one modest database.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
    - postgres
    - -c
    - shared_buffers=64MB
    - -c
    - max_connections=30
    volumes:
    - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_PROD_DB_USER:-n8nprod} -d ${N8N_PROD_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  n8n-prod:
    # Built by the managed updater as corekit/n8n:<version>-git<short commit>.
    # Re-pin this after every `corekit managed-update apply n8n`, or set
    # N8N_PROD_IMAGE in .env to override it.
    image: ${N8N_PROD_IMAGE:-corekit/n8n:2.39.6-git6c84c643d221}
    container_name: n8n-prod
    profiles:
    - n8n-prod
    restart: unless-stopped
    depends_on:
      n8n-prod-postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-prod-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_PROD_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_PROD_DB_USER:-n8nprod}
      DB_POSTGRESDB_PASSWORD: ${N8N_PROD_DB_PASSWORD}

      # Its own key. Generated by the owner at apply time, never reused from
      # any other instance, and kept in the password manager as well as here.
      N8N_ENCRYPTION_KEY: ${N8N_PROD_ENCRYPTION_KEY}

      N8N_HOST: ${N8N_PROD_HOSTNAME:-n8n-prod.<yourdomain>.com}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_PROD_HOSTNAME:-n8n-prod.<yourdomain>.com}/
      N8N_EDITOR_BASE_URL: https://${N8N_PROD_HOSTNAME:-n8n-prod.<yourdomain>.com}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/London}

      # Regular execution mode. No queue, no workers, no Redis.
      EXECUTIONS_MODE: regular

      # Task runner, external, same version as n8n itself.
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_PROD_RUNNER_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"

      # No community packages of any kind, verified or not, and none usable as
      # an AI Agent tool.
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "false"

      # Nodes that run commands, reach the filesystem or open a shell are not
      # needed by workflows that only call an external API.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'

      # An exposed REST API turns any leaked API key into full control of the
      # instance. Nothing calls it here, so it stays off.
      N8N_PUBLIC_API_DISABLED: "true"

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_LOG_LEVEL: info
    volumes:
    - ./data/n8n:/home/node/.n8n
    # No ports. The stack's tunnel connector is the only way in.
    expose:
    - '5678'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  n8n-prod-runner:
    image: ${N8N_PROD_RUNNER_IMAGE:-corekit/n8n-runners:2.39.6-git6c84c643d221}
    container_name: n8n-prod-runner
    profiles:
    - n8n-prod
    restart: unless-stopped
    depends_on:
      n8n-prod:
        condition: service_started
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-prod:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_PROD_RUNNER_AUTH_TOKEN}
      N8N_RUNNERS_MAX_CONCURRENCY: 5
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/London}
    # Hardened per the runner guidance in the managed-updates handover note.
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
