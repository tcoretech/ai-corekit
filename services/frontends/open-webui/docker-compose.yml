services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    restart: unless-stopped
    container_name: open-webui
    profiles:
    - open-webui
    env_file:
      - .env
    environment:
    - OLLAMA_BASE_URL=http://ollama:11434
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./data:/app/backend/data

