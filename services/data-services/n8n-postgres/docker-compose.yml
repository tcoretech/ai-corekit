# A Postgres dedicated to one n8n instance.
#
# Worth having when the shared server hosts several services' databases behind a
# single superuser role: every service holding that password can then read every
# other service's tables, n8n's included. A dedicated server lets the stack own
# its data, with no network path to it from outside.
services:
  n8n-postgres:
    image: postgres:17
    container_name: n8n-postgres
    profiles:
    - n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_PLAY_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_PLAY_DB_USER:-n8nplay}
      POSTGRES_PASSWORD: ${N8N_PLAY_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
    - postgres
    - -c
    - shared_buffers=128MB
    - -c
    - max_connections=50
    volumes:
    - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_PLAY_DB_USER:-n8nplay} -d ${N8N_PLAY_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
