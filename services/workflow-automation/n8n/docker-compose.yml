services:
  n8n:
    # Managed deployments override this with a version+Git-commit candidate
    # tag. The fallback remains exact and contains no moving tag.
    image: ${N8N_MANAGED_IMAGE:-corekit/n8n:2.34.4-git1.2.3-r1}
    build:
      context: .
      pull: false
    container_name: n8n
    profiles:
      - n8n
    restart: unless-stopped
    environment:
      DB_POSTGRESDB_DATABASE: postgres
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_USER: postgres
      DB_TYPE: postgresdb
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_METRICS: "true"
      N8N_PAYLOAD_SIZE_MAX: "256"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_TRUST_PROXY: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      NODES_EXCLUDE: ${NODES_EXCLUDE:-}
      NODE_ENV: production
      WEBHOOK_URL: ${N8N_HOSTNAME:+https://}${N8N_HOSTNAME:-http://localhost:5678}/
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./data/backups:/backup
      - ./config/workflows:/import/workflows:ro
      - ./config/credentials:/import/credentials:ro
      - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
      - ${PROJECT_ROOT}/services/.shared-resources/media:/data/media
      - ${PROJECT_ROOT}/services/.shared-resources/temp:/data/temp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:5678/healthz &&
          wget -q -O /dev/null http://127.0.0.1:5678/healthz/readiness
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s
    stop_grace_period: 60s

  n8n-runner:
    image: ${N8N_MANAGED_RUNNER_IMAGE:-corekit/n8n-runners:2.34.4-r1}
    build:
      context: ./runner
      pull: false
    container_name: n8n-runner
    profiles:
      - n8n
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=128m
      - /home/runner:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
      - ./task-runners-managed.json:/etc/n8n-task-runners.json:ro
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5680/healthz"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  n8n_storage: {}
