services:
  gitea:
    image: gitea/gitea:latest@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309
    container_name: gitea
    profiles:
    - gitea
    restart: unless-stopped
    depends_on:
    - gitea-db
    env_file:
      - .env
    environment:
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=postgres
    - GITEA__database__HOST=gitea-db:5432
    - GITEA__database__NAME=gitea
    - GITEA__database__USER=gitea
    - GITEA__database__PASSWD=gitea
    ports:
    - ${GITEA_SSH_PORT:-2222}:22
    volumes:
    - gitea_data:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
  gitea-db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    container_name: gitea-db
    profiles:
    - gitea
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - POSTGRES_USER=gitea
    - POSTGRES_PASSWORD=gitea
    - POSTGRES_DB=gitea
    volumes:
    - gitea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U gitea
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  gitea_data: {}
  gitea_postgres_data: {}
