services:
  mailpit:
    image: axllent/mailpit:latest@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    container_name: mailpit
    restart: unless-stopped
    volumes:
    - mailpit_data:/data
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    env_file:
      - .env
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH_FILE: ${MAILPIT_UI_AUTH_FILE:-}
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
    expose:
    - '1025'
    - '8025'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '1025'
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  mailpit_data: {}
