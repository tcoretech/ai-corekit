services:
  python-runner:
    image: python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
    container_name: python-runner
    env_file:
      - .env
    profiles:
    - python-runner
    restart: unless-stopped
    working_dir: /app
    command: /bin/sh -c 'if [ -f /app/requirements.txt ]; then python -m pip install
      --no-cache-dir -r /app/requirements.txt; fi; python /app/main.py'
    volumes:
    - .:/app

