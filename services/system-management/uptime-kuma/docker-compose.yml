services:
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    container_name: uptime-kuma
    profiles:
    - uptime-kuma
    restart: unless-stopped
    volumes:
    - uptime-kuma_data:/app/data
    - ${PROJECT_ROOT}/services/.shared-resources/shared:/data/shared
    - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
    - TZ=${TZ:-Europe/Berlin}
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3001 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  uptime-kuma_data: {}
