services:
  comfyui:
    image: yanwk/comfyui-boot:cu124-slim@sha256:0deb9ac5a9464fc089f5a6672ee58d223f4e84fae2a205cebfe7abc6d316c1cf
    container_name: comfyui
    profiles:
    - comfyui
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - CLI_ARGS=--listen 0.0.0.0 --cpu
    volumes:
    - comfyui_data:/home/runner
    healthcheck:
      test:
      - CMD
      - wget
      - -qO
      - /dev/null
      - http://localhost:8188
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  comfyui_data: {}
