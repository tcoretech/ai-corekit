services:
  jitsi-jvb:
    image: jitsi/jvb:stable-10008@sha256:bcd27c59b40ca42e86a9a475655ede68f8f0db230d14b36a59e4293757b0d694
    container_name: jitsi-jvb
    profiles:
    - jitsi
    restart: unless-stopped
    ports:
    - 127.0.0.1:10000:10000/udp
    volumes:
    - ./config/local/jitsi-jvb:/config
    env_file:
      - .env
    environment:
    - DOCKER_HOST_ADDRESS=${JVB_DOCKER_HOST_ADDRESS}
    - XMPP_AUTH_DOMAIN=auth.${JITSI_XMPP_DOMAIN}
    - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_XMPP_DOMAIN}
    - XMPP_SERVER=jitsi-prosody
    - JVB_AUTH_USER=jvb
    - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
    - JVB_BREWERY_MUC=jvbbrewery
    - JVB_PORT=10000
    - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
    - PUBLIC_URL=https://${JITSI_HOSTNAME}
    - JVB_WS_DOMAIN=${JITSI_HOSTNAME}
    - JVB_WS_SERVER_ID=jvb1
    - TZ=${TZ}
    depends_on:
    - jitsi-prosody
  jitsi-web:
    image: jitsi/web:stable-10008@sha256:b77d2fc7aa145db72f9c558d47c13d99e3ce72f7b05f8f78710fd8f9ce2c31b0
    container_name: jitsi-web
    profiles:
    - jitsi
    restart: unless-stopped
    volumes:
    - ./config/local/jitsi-web:/config
    - ./data/transcripts:/usr/share/jitsi-meet/transcripts
    env_file:
      - .env
    environment:
    - ENABLE_LETSENCRYPT=0
    - ENABLE_HTTP_REDIRECT=0
    - DISABLE_HTTPS=1
    - PUBLIC_URL=https://${JITSI_HOSTNAME}
    - XMPP_DOMAIN=${JITSI_XMPP_DOMAIN}
    - XMPP_AUTH_DOMAIN=auth.${JITSI_XMPP_DOMAIN}
    - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
    - XMPP_MUC_DOMAIN=muc.${JITSI_XMPP_DOMAIN}
    - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_XMPP_DOMAIN}
    - JICOFO_AUTH_USER=jicofo
    - JVB_WS_DOMAIN=${JITSI_HOSTNAME}
    - JVB_WS_SERVER_ID=jvb1
    - TZ=${TZ}
    depends_on:
    - jitsi-prosody
    expose:
    - '80'
  jitsi-prosody:
    image: jitsi/prosody:stable-10008@sha256:29456e777bc163bfce38096ba5ce6e159c90f1d245cdcc03835537fe0921760d
    container_name: jitsi-prosody
    profiles:
    - jitsi
    restart: unless-stopped
    expose:
    - '5222'
    - '5347'
    - '5280'
    volumes:
    - ./config/local/jitsi-prosody-config:/config
    - ./config/local/jitsi-prosody-plugins:/prosody-plugins-custom
    env_file:
      - .env
    environment:
    - AUTH_TYPE=internal
    - ENABLE_GUESTS=1
    - XMPP_DOMAIN=${JITSI_XMPP_DOMAIN}
    - XMPP_AUTH_DOMAIN=auth.${JITSI_XMPP_DOMAIN}
    - XMPP_GUEST_DOMAIN=guest.${JITSI_XMPP_DOMAIN}
    - XMPP_MUC_DOMAIN=muc.${JITSI_XMPP_DOMAIN}
    - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_XMPP_DOMAIN}
    - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
    - JICOFO_AUTH_USER=jicofo
    - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
    - JVB_AUTH_USER=jvb
    - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
    - TZ=${TZ}
  jitsi-jicofo:
    image: jitsi/jicofo:stable-10008@sha256:c746b190fffabf95e220fcaad8970656aff3052eed30fd2fa0edd8f0e24d2699
    container_name: jitsi-jicofo
    profiles:
    - jitsi
    restart: unless-stopped
    volumes:
    - ./config/local/jitsi-jicofo:/config
    env_file:
      - .env
    environment:
    - XMPP_DOMAIN=${JITSI_XMPP_DOMAIN}
    - XMPP_AUTH_DOMAIN=auth.${JITSI_XMPP_DOMAIN}
    - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.${JITSI_XMPP_DOMAIN}
    - XMPP_MUC_DOMAIN=muc.${JITSI_XMPP_DOMAIN}
    - XMPP_SERVER=jitsi-prosody
    - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
    - JICOFO_AUTH_USER=jicofo
    - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
    - JVB_BREWERY_MUC=jvbbrewery
    - TZ=${TZ}
    depends_on:
    - jitsi-prosody
