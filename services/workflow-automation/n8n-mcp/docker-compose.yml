services:
  n8n-mcp:
    image: ${N8N_MCP_IMAGE:-ghcr.io/czlonkowski/n8n-mcp:2.69.0}
    container_name: n8n-mcp
    profiles:
    - n8n-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
    - AUTH_TOKEN=${N8N_MCP_TOKEN}
    - N8N_HOST=n8n
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - LOG_LEVEL=info
    - MCP_MODE=http
    - N8N_MCP_TELEMETRY_DISABLED=true
    - NODE_ENV=production
    - PORT=3000
    # The managed n8n API is reached by its private Docker DNS name. Metadata IPs remain blocked.
    - WEBHOOK_SECURITY_MODE=${N8N_MCP_WEBHOOK_SECURITY_MODE:-permissive}
    volumes:
    - n8n-mcp-data:/app/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  n8n-mcp-data: {}
